# AI Daily Brief local configuration

# Jev (TypeSafe System One) is assist-only topic scoring.
# Disable with JEV_ASSIST=0 or jev.enabled: false. Scores never select or empty an edition.
jev:
  enabled: true
  model: "jev-latest"
  request_timeout_sec: 30
  batch_timeout_sec: 180
  daily_request_limit: 100

llm:
  # Leave null to use the OpenAI SDK default endpoint, or set an
  # OpenAI-compatible /v1 URL. OPENAI_BASE_URL takes precedence.
  base_url: null
  model: "gpt-5.4"
  model_editorial: "gpt-5.4"
  max_tokens: 1024
  temperature: 0.3

sources:
  hackernews:
    enabled: true
    top_n: 30
    min_score: 50

  github_trending:
    enabled: true
    languages: ["python", "typescript", "rust", "go"]
    since: "daily"
    max_existing_stars: 100000

  huggingface:
    enabled: true
    daily_papers: true
    trending_models: true
    top_n: 10

  rss_feeds:
    enabled: true
    feeds:
      - name: "OpenAI Blog"
        url: "https://openai.com/blog/rss.xml"
      - name: "Anthropic"
        url: "https://www.anthropic.com/rss.xml"
      - name: "Google AI Blog"
        url: "https://blog.google/technology/ai/rss/"
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "GitHub Blog"
        url: "https://github.blog/feed/"
      - name: "The Verge AI"
        url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
      - name: "TechCrunch AI"
        url: "https://techcrunch.com/category/artificial-intelligence/feed/"
      - name: "机器之心"
        url: "https://www.jiqizhixin.com/rss"
      - name: "arXiv cs.AI"
        url: "https://rss.arxiv.org/rss/cs.AI"

  ruanyf_weekly:
    enabled: true
    repo: "ruanyf/weekly"
    max_items: 20

  reddit:
    enabled: true
    subreddits: ["LocalLLaMA"]
    top_n: 15
    min_score: 50

filter:
  keywords:
    include:
      - "ai"
      - "llm"
      - "gpt"
      - "claude"
      - "gemini"
      - "copilot"
      - "machine learning"
      - "deep learning"
      - "transformer"
      - "diffusion"
      - "agent"
      - "rag"
      - "fine-tune"
      - "embedding"
      - "huggingface"
      - "openai"
      - "anthropic"
      - "deepseek"
      - "mistral"
      - "llama"
      - "coding assistant"
      - "code generation"
      - "大模型"
      - "量化"
      - "微调"
      - "本地部署"
    exclude: ["crypto", "nft", "blockchain"]

output:
  editions:
    directory: "editions"

  # Legacy outputs stay enabled until the first approved HTML edition succeeds.
  # They are disabled only as part of the later production switch.
  github_readme:
    enabled: true
    file: "daily-brief.md"
  archive:
    enabled: true
    directory: "archives"
