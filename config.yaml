# AI Daily Brief local configuration

# Jev (TypeSafe System One) is assist-only topic scoring.
# Canonical disable: JEV_ASSIST=0 (checked before any HTTP). Scores never select or empty an edition.
jev:
  enabled: true
  model: "jev-latest"
  request_timeout_sec: 30
  batch_timeout_sec: 180
  daily_request_limit: 100

llm:
  # Leave null to use the OpenAI SDK default endpoint, or set an
  # OpenAI-compatible /v1 URL. OPENAI_BASE_URL takes precedence.
  base_url: null
  model: "gpt-5.4"
  model_editorial: "gpt-5.4"
  max_tokens: 1024
  temperature: 0.3

# Each key is a source id and gets its own record in every edition.
# `kind` picks the fetcher. `name` labels the items. The only off switch is
# `disabled: "<reason>"`; keep the URL so restoring is deleting that one line.
sources:
  hackernews:
    kind: hackernews
    name: "HackerNews"
    top_n: 30
    min_score: 50

  github_trending:
    kind: github_trending
    name: "GitHub"
    languages: ["python", "typescript", "rust", "go"]
    since: "daily"
    max_existing_stars: 100000

  huggingface:
    kind: huggingface
    name: "HuggingFace Models"
    daily_papers: true
    trending_models: true
    top_n: 10

  hf_papers:
    kind: huggingface
    name: "HuggingFace Papers"
    daily_papers: true
    trending_models: false
    top_n: 10

  openai:
    kind: feed
    name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"

  anthropic:
    kind: html_listing
    name: "Anthropic Engineering"
    url: "https://www.anthropic.com/engineering"

  anthropic_news:
    kind: html_listing
    name: "Anthropic"
    url: "https://www.anthropic.com/news"

  google_ai:
    kind: feed
    name: "Google AI Blog"
    url: "https://blog.google/technology/ai/rss/"

  huggingface_blog:
    kind: feed
    name: "Hugging Face Blog"
    url: "https://huggingface.co/blog/feed.xml"

  github:
    kind: feed
    name: "GitHub Blog"
    url: "https://github.blog/feed/"

  theverge:
    kind: feed
    name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"

  techcrunch:
    kind: feed
    name: "TechCrunch AI"
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"

  jiqizhixin:
    kind: feed
    name: "机器之心"
    url: "https://www.jiqizhixin.com/rss"
    disabled: "www.jiqizhixin.com returns the data-service landing page at /, /rss, /articles, and /api/article. There is no article list."

  arxiv_ai:
    kind: feed
    name: "arXiv cs.AI"
    url: "https://rss.arxiv.org/rss/cs.AI"

  mistral:
    kind: feed
    name: "Mistral"
    url: "https://mistral.ai/news/rss"

  xai:
    kind: feed
    name: "xAI"
    url: "https://x.ai/news/rss.xml"
    disabled: "x.ai/news/rss.xml is HTTP 404. x.ai/news and x.ai/blog are HTTP 403. Do not request x.ai and do not bypass the block."

  deepseek:
    kind: deepseek_updates
    name: "DeepSeek"
    url: "https://api-docs.deepseek.com/updates/"
    max_items: 3

  ms_ai:
    kind: feed
    name: "Microsoft AI"
    url: "https://news.microsoft.com/source/topics/ai/feed/"

  parliament:
    kind: feed
    name: "UK Parliament Committees"
    url: "https://committees.parliament.uk/"
    disabled: "committees.parliament.uk returns HTTP 403. Do not request it and do not bypass the block."

  ruanyf_weekly:
    kind: ruanyf_weekly
    name: "阮一峰周刊"
    repo: "ruanyf/weekly"
    max_items: 20

  reddit:
    kind: reddit
    name: "Reddit"
    subreddits: ["LocalLLaMA"]
    top_n: 15
    min_score: 50

filter:
  keywords:
    include:
      - "ai"
      - "llm"
      - "gpt"
      - "claude"
      - "gemini"
      - "copilot"
      - "machine learning"
      - "deep learning"
      - "transformer"
      - "diffusion"
      - "agent"
      - "rag"
      - "fine-tune"
      - "embedding"
      - "huggingface"
      - "openai"
      - "anthropic"
      - "deepseek"
      - "mistral"
      - "llama"
      - "coding assistant"
      - "code generation"
      - "大模型"
      - "量化"
      - "微调"
      - "本地部署"
    exclude: ["crypto", "nft", "blockchain"]

output:
  editions:
    directory: "editions"

  # Legacy outputs stay enabled until the first approved HTML edition succeeds.
  # They are disabled only as part of the later production switch.
  github_readme:
    enabled: true
    file: "daily-brief.md"
  archive:
    enabled: true
    directory: "archives"
