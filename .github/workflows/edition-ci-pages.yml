name: Edition CI and Pages

on:
  pull_request:
    paths:
      - "editions/**"
      - "main.py"
      - "sources.py"
      - "edition.py"
      - "contributions.py"
      - "config.yaml"
      - "integrations/**"
      - "outputs.py"
      - "templates/**"
      - "scripts/edition_ci.py"
      - "tests/test_edition*.py"
      - "tests/test_main.py"
      - "tests/test_source_status.py"
      - "tests/test_render.py"
      - ".github/workflows/edition-ci-pages.yml"
  push:
    branches: [main]
    paths:
      - "editions/**"
      - "main.py"
      - "sources.py"
      - "edition.py"
      - "contributions.py"
      - "config.yaml"
      - "integrations/**"
      - "outputs.py"
      - "templates/**"
      - "scripts/edition_ci.py"
      - "tests/test_edition*.py"
      - "tests/test_main.py"
      - "tests/test_source_status.py"
      - "tests/test_render.py"
      - ".github/workflows/edition-ci-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-daily-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      has_editions: ${{ steps.editions.outputs.has_editions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Validate edition-only pull request scope
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/edition_ci.py scope
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Protect edition history on main push
        if: github.event_name == 'push'
        run: >-
          python scripts/edition_ci.py scope
          --base "${{ github.event.before }}"
          --head "${{ github.sha }}"

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Validate and build public site
        run: |
          python scripts/edition_ci.py validate
          python scripts/edition_ci.py build --output _site

      - name: Detect public editions
        id: editions
        shell: bash
        run: |
          if find editions -mindepth 2 -maxdepth 2 -name edition.json -print -quit 2>/dev/null | grep -q .; then
            echo "has_editions=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_editions=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.editions.outputs.has_editions == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.validate.outputs.has_editions == 'true'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
